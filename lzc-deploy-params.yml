params:
  - id: cn_db_pw
    type: secret
    name: "数据库密码"
    description: "PostgreSQL 数据库密码（已预置随机值，应用自动使用）"
    default_value: "wRk5Zh2mQb8nXs4d"
    optional: false
  - id: cn_valkey_pw
    type: secret
    name: "Valkey 密码"
    description: "Valkey(Redis) 访问密码（已预置随机值，应用自动使用）"
    default_value: "tG7wCu3jNi9pLa6f"
    optional: false
  - id: web_domain
    type: string
    name: "Web 访问域名"
    description: "本应用对外访问域名（浏览器地址栏中的域名，不带 https:// 与末尾斜杠），用于服务端生成正确的对外链接"
    default_value: "colanode.你的域名.com"
    optional: false

locales:
